
## `index.html`

```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur de Présentation de Serveur</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- SIDEBAR : Contrôles -->
<div id="sidebar">
  <div class="brand">
    <div class="brand-logo">GS</div>
    <div>
      <h1>Générateur de Serveur</h1>
      <span>Discord × Minecraft</span>
    </div>
  </div>

  <h2 class="section-title">Informations générales</h2>
  <div class="panel">
    <div class="form-group">
      <label for="server-name">Nom du serveur</label>
      <input type="text" id="server-name" placeholder="Mon Serveur">
    </div>
    <div class="form-group">
      <label for="server-tagline">Slogan / description</label>
      <input type="text" id="server-tagline" placeholder="Une phrase d'accroche">
    </div>
  </div>

  <h2 class="section-title">Plateformes</h2>
  <div class="panel">
    <div class="checkbox-row">
      <label for="enable-discord" style="margin:0;">Activer Discord</label>
      <label class="switch">
        <input type="checkbox" id="enable-discord" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="form-group" id="discord-settings">
      <label for="discord-invite">Invitation (ex : discord.gg/monserveur)</label>
      <input type="text" id="discord-invite" value="discord-developers">
      <div id="discord-status" class="field-status"></div>
    </div>

    <div class="checkbox-row">
      <label for="enable-minecraft" style="margin:0;">Activer Minecraft</label>
      <label class="switch">
        <input type="checkbox" id="enable-minecraft" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="form-group" id="minecraft-settings">
      <label for="minecraft-ip">Adresse du serveur (ex : mc.exemple.fr)</label>
      <input type="text" id="minecraft-ip" value="mc.hypixel.net">
      <div id="minecraft-status" class="field-status"></div>
    </div>
  </div>

  <h2 class="section-title">Apparence</h2>
  <div class="panel color-grid">
    <div class="form-group">
      <label for="color-bg">Fond</label>
      <input type="color" id="color-bg" value="#080A0F">
    </div>
    <div class="form-group">
      <label for="color-text">Texte</label>
      <input type="color" id="color-text" value="#FFFFFF">
    </div>
    <div class="form-group">
      <label for="color-discord">Accent Discord</label>
      <input type="color" id="color-discord" value="#5865F2">
    </div>
    <div class="form-group">
      <label for="color-mc">Accent Minecraft</label>
      <input type="color" id="color-mc" value="#2EA043">
    </div>
  </div>

  <h2 class="section-title">Cartes « Pourquoi nous rejoindre ? »</h2>
  <div class="panel">
    <form id="card-form">
      <div class="form-group">
        <input type="text" id="card-title" placeholder="Titre de l'avantage" required>
      </div>
      <div class="form-group">
        <input type="text" id="card-desc" placeholder="Description courte" required>
      </div>
      <button type="submit" id="card-submit">Ajouter la carte</button>
      <button type="button" id="card-cancel" class="btn-secondary" style="display:none; margin-top:8px;">Annuler</button>
    </form>
    <div id="cards-list" style="margin-top:14px;"></div>
  </div>

  <h2 class="section-title">Export</h2>
  <div class="panel">
    <button id="export-btn" class="btn-success">Générer et télécharger le site</button>
  </div>
</div>

<!-- PREVIEW AREA -->
<div id="preview-area">
  <div class="preview-controls">
    <button data-mode="desktop" class="active" type="button">Bureau</button>
    <button data-mode="tablet" type="button">Tablette</button>
    <button data-mode="mobile" type="button">Mobile</button>
  </div>
  <div id="preview-container">
    <iframe id="preview-frame" title="Aperçu du site généré"></iframe>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
